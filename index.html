<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Duofly</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --green:#00a884;
  --green2:#008f72;
  --bg:#efeae2;
  --white:#fff;
  --text:#111b21;
  --muted:#667781;
  --border:#e9edef;
  --bubble:#d9fdd3;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#dfe5e7;
  color:var(--text);
}

button,input{
  font-family:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f0f2f5;
  padding:20px;
}

.loginBox{
  width:100%;
  max-width:400px;
  background:white;
  border-radius:16px;
  padding:35px 25px;
  text-align:center;
  box-shadow:0 8px 35px rgba(0,0,0,.12);
}

.logo{
  width:72px;
  height:72px;
  border-radius:22px;
  background:var(--green);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:bold;
  margin:0 auto 18px;
}

.loginBox h1{
  font-size:30px;
  margin-bottom:8px;
}

.loginBox p{
  color:var(--muted);
  margin-bottom:28px;
}

.googleBtn{
  width:100%;
  padding:14px;
  border-radius:10px;
  background:#fff;
  border:1px solid #ddd;
  font-size:16px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}

.googleIcon{
  font-size:20px;
}

/* PROFILE SETUP */

#profilePage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:#f0f2f5;
}

.profileBox{
  background:#fff;
  width:100%;
  max-width:430px;
  padding:30px;
  border-radius:16px;
  box-shadow:0 8px 30px rgba(0,0,0,.12);
}

.profileBox h2{
  margin-bottom:8px;
}

.profileBox p{
  color:var(--muted);
  margin-bottom:22px;
}

.avatarUpload{
  text-align:center;
  margin-bottom:22px;
}

.avatarPreview{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#ddd;
  object-fit:cover;
  display:block;
  margin:0 auto 10px;
}

.profileBox input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:9px;
  margin-bottom:12px;
  outline:none;
}

.primaryBtn{
  width:100%;
  padding:14px;
  border-radius:9px;
  background:var(--green);
  color:white;
  font-size:16px;
  font-weight:bold;
}

/* APP */

#app{
  height:100vh;
  display:flex;
  background:white;
  overflow:hidden;
}

.sidebar{
  width:400px;
  min-width:320px;
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  background:#fff;
}

.topBar{
  height:60px;
  background:#f0f2f5;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
}

.topBar h2{
  font-size:21px;
}

.topActions{
  display:flex;
  gap:8px;
}

.iconBtn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:transparent;
  font-size:20px;
}

.iconBtn:hover{
  background:#ddd;
}

.searchArea{
  padding:8px 12px;
  background:#fff;
}

.searchBox{
  background:#f0f2f5;
  border-radius:9px;
  padding:8px 12px;
  display:flex;
  align-items:center;
  gap:8px;
}

.searchBox input{
  width:100%;
  border:0;
  background:transparent;
  outline:none;
  font-size:14px;
}

.tabs{
  display:flex;
  background:#fff;
  border-bottom:1px solid var(--border);
}

.tab{
  flex:1;
  padding:14px 5px;
  background:white;
  color:var(--muted);
  font-weight:bold;
  border-bottom:3px solid transparent;
}

.tab.active{
  color:var(--green);
  border-bottom-color:var(--green);
}

.chatList{
  overflow-y:auto;
  flex:1;
}

.chatItem{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 15px;
  cursor:pointer;
}

.chatItem:hover{
  background:#f5f5f5;
}

.chatAvatar{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.chatInfo{
  flex:1;
  min-width:0;
}

.chatName{
  font-size:16px;
  margin-bottom:5px;
}

.lastMsg{
  color:var(--muted);
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.empty{
  padding:30px;
  text-align:center;
  color:var(--muted);
}

/* CHAT */

.chatPanel{
  flex:1;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  min-width:0;
}

.chatHeader{
  height:60px;
  background:#f0f2f5;
  display:flex;
  align-items:center;
  padding:0 15px;
  gap:12px;
}

.backBtn{
  display:none;
}

.headerAvatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
}

.headerInfo{
  flex:1;
}

.headerName{
  font-weight:bold;
}

.headerStatus{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

.chatHeaderActions{
  display:flex;
  gap:3px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.messageRow{
  display:flex;
}

.messageRow.me{
  justify-content:flex-end;
}

.message{
  max-width:70%;
  padding:8px 10px;
  border-radius:8px;
  background:#fff;
  box-shadow:0 1px 1px rgba(0,0,0,.08);
  position:relative;
}

.messageRow.me .message{
  background:var(--bubble);
}

.message img{
  max-width:250px;
  max-height:300px;
  border-radius:7px;
  display:block;
  margin-bottom:5px;
}

.messageText{
  word-wrap:break-word;
  white-space:pre-wrap;
}

.messageMeta{
  font-size:10px;
  color:#667781;
  text-align:right;
  margin-top:3px;
}

.replyPreview{
  border-left:4px solid var(--green);
  background:rgba(0,0,0,.06);
  padding:5px 8px;
  border-radius:4px;
  margin-bottom:5px;
  font-size:12px;
}

.reaction{
  position:absolute;
  right:-5px;
  bottom:-13px;
  background:white;
  border-radius:20px;
  padding:2px 5px;
  box-shadow:0 1px 4px rgba(0,0,0,.2);
  font-size:12px;
}

.messageMenu{
  position:absolute;
  top:28px;
  right:5px;
  background:white;
  box-shadow:0 4px 15px rgba(0,0,0,.2);
  border-radius:8px;
  z-index:10;
  overflow:hidden;
}

.messageMenu button{
  display:block;
  background:white;
  padding:10px 15px;
  width:130px;
  text-align:left;
}

.messageMenu button:hover{
  background:#f2f2f2;
}

/* COMPOSER */

.composer{
  min-height:60px;
  background:#f0f2f5;
  padding:8px 12px;
  display:flex;
  align-items:center;
  gap:8px;
}

.composer input{
  flex:1;
  border:0;
  outline:none;
  padding:13px 15px;
  border-radius:25px;
  font-size:15px;
}

.sendBtn{
  width:45px;
  height:45px;
  border-radius:50%;
  background:var(--green);
  color:white;
  font-size:18px;
}

.fileBtn{
  width:42px;
  height:42px;
  border-radius:50%;
  background:transparent;
  font-size:21px;
}

/* DRAWER */

.drawer{
  position:fixed;
  top:0;
  right:-330px;
  width:330px;
  height:100%;
  background:white;
  z-index:100;
  box-shadow:-5px 0 20px rgba(0,0,0,.2);
  transition:.25s;
}

.drawer.open{
  right:0;
}

.drawerHeader{
  height:60px;
  background:var(--green);
  color:white;
  display:flex;
  align-items:center;
  padding:0 15px;
  gap:15px;
}

.drawerContent{
  padding:20px;
}

.myAvatar{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:0 auto 15px;
}

.profileName{
  text-align:center;
  font-size:21px;
  font-weight:bold;
}

.profileUsername{
  text-align:center;
  color:var(--muted);
  margin-top:5px;
}

.settingItem{
  padding:15px 5px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}

.logout{
  color:#e53935;
}

/* NEW CHAT */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modalBox{
  background:white;
  width:100%;
  max-width:400px;
  border-radius:12px;
  padding:22px;
}

.modalBox h3{
  margin-bottom:15px;
}

.modalBox input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:8px;
  margin-bottom:12px;
}

.modalActions{
  display:flex;
  gap:10px;
}

.modalActions button{
  flex:1;
  padding:12px;
  border-radius:8px;
}

.cancel{
  background:#eee;
}

.searchResult{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
}

.searchResult:hover{
  background:#f0f0f0;
}

.searchResult img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
}

/* DARK */

body.dark{
  background:#111b21;
  --bg:#0b141a;
  --white:#202c33;
  --text:#e9edef;
  --muted:#8696a0;
  --border:#2a3942;
  --bubble:#005c4b;
}

body.dark .sidebar,
body.dark .chatPanel,
body.dark .searchArea,
body.dark .tabs,
body.dark .tab,
body.dark .chatItem,
body.dark .drawer,
body.dark .modalBox{
  background:#111b21;
  color:#e9edef;
}

body.dark .topBar,
body.dark .chatHeader,
body.dark .composer{
  background:#202c33;
}

body.dark .searchBox,
body.dark .composer input{
  background:#2a3942;
  color:white;
}

body.dark .tab{
  color:#8696a0;
}

body.dark .message{
  background:#202c33;
  color:#e9edef;
}

body.dark .messageMenu,
body.dark .messageMenu button{
  background:#202c33;
  color:white;
}

body.dark .messageMenu button:hover{
  background:#344047;
}

body.dark .modalBox input{
  background:#202c33;
  color:white;
  border-color:#394952;
}

body.dark .cancel{
  background:#394952;
  color:white;
}

/* MOBILE */

@media(max-width:750px){

  .sidebar{
    width:100%;
    min-width:0;
  }

  .chatPanel{
    display:none;
  }

  .chatPanel.mobileOpen{
    display:flex;
    position:fixed;
    inset:0;
    z-index:50;
  }

  .backBtn{
    display:block;
  }

  .message{
    max-width:82%;
  }
}

@media(min-width:751px){
  .mobileOnly{
    display:none;
  }
}
</style>
</head>

<body>

<div id="loginPage">

  <div class="loginBox">

    <div class="logo">D</div>

    <button class="googleBtn" id="googleLogin">
      <span class="googleIcon">G</span>
      Continue with Google
    </button>

  </div>

</div>


<!-- PROFILE SETUP -->

<div id="profilePage" class="hidden">

  <div class="profileBox">

    <h2>Create your Duofly profile</h2>

    <p>Complete your profile to start chatting.</p>

    <div class="avatarUpload">

      <img
        id="profilePreview"

</div>


<!-- MAIN APP -->

<div id="app" class="hidden">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="topBar">

      <h2>Duofly</h2>

      <div class="topActions">

        <button
          class="iconBtn"
          id="newChatBtn"
          title="New chat"
        >✚</button>

        <button
          class="iconBtn"
          id="profileBtn"
          title="Profile"
        >⋮</button>

      </div>

    </div>


    <div class="searchArea">

      <div class="searchBox">

        🔎

        <input
          id="chatSearch"

      </div>

    </div>


    <div class="tabs">

      <button
        class="tab active"

      >
        CHATS
      </button>

      <button
        class="tab"
        data-tab="updates"
      >
        UPDATES
      </button>

      <button
        class="tab"
        data-tab="calls"
      >
        CALLS
      </button>

    </div>


    <div id="chatList" class="chatList">

      <div class="empty">
        No chats yet.<br>
        Tap ✚ to start a chat.
      </div>

    </div>

  </aside>


  <!-- CHAT PANEL -->

  <main id="chatPanel" class="chatPanel">

    <div class="chatHeader">

      <button
        class="iconBtn backBtn"
        id="backBtn"
      >
        ←
      </button>

      <img
        id="headerAvatar"
        class="headerAvatar"
        src="https://via.placeholder.com/42"
      >

      <div class="headerInfo">

        <div
          id="headerName"
          class="headerName"
        >
          Select a chat
        </div>

        <div
          id="headerStatus"
          class="headerStatus"
        >
          —
        </div>

      </div>

      <div class="chatHeaderActions">

        <button
          class="iconBtn"
          id="voiceCallBtn"
        >
          📞
        </button>

        <button
          class="iconBtn"
          id="videoCallBtn"

          📹

    <div

      <div class="empty">

      </div>

    <div class="composer">

        type="file"

        class="fileBtn"

        📎
      </button>

      <input
        id="messageInput"
        type="text"
        placeholder="Type a message"
        autocomplete="off"
      >

      <button
        class="sendBtn"
        id="sendBtn"
      >
        ➤
      </button>

    </div>

  </main>

</div>


<!-- PROFILE DRAWER -->

<div
  id="profileDrawer"
  class="drawer"
>

  <div class="drawerHeader">

    <button
      class="iconBtn"
      id="closeDrawer"
      style="color:white"
    >
      ←
    </button>

    <b>Profile</b>

  </div>

  <div class="drawerContent">

    <img
      id="myAvatar"
      class="myAvatar"
      src="https://via.placeholder.com/110"
    >

    <div
      id="myName"
      class="profileName"
    >
      —
    </div>

    <div
      id="myUsername"
      class="profileUsername"
    >
      —
    </div>

    <br>

    <div
      class="settingItem"
      id="darkModeBtn"
    >
      🌙 Dark mode
    </div>

    <div
      class="settingItem"
      id="logoutBtn"
    >
      🚪 Logout
    </div>

  </div>

</div>


<!-- NEW CHAT MODAL -->

<div
  id="newChatModal"
  class="modal hidden"
>

  <div class="modalBox">

    <h3>New Chat</h3>

    <input
      id="usernameSearch"
      placeholder="Enter username"
      autocomplete="off"
    >

    <div id="userResults"></div>

    <div class="modalActions">

      <button
        class="cancel"
        id="closeNewChat"
      >
        Cancel
      </button>

    </div>

  </div>

</div>


<script type="module">

/* =========================
   FIREBASE
========================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  addDoc,
  collection,
  query,
  where,
  orderBy,
  onSnapshot,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-storage.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCsWRJmi5eae-KEOh6kOsCk73T4POozAjE",

  authDomain:
    "duofly-385c3.firebaseapp.com",

  projectId:
    "duofly-385c3",

  storageBucket:
    "duofly-385c3.firebasestorage.app",

  messagingSenderId:
    "342514444004",

  appId:
    "1:342514444004:web:2fa89c067fc653f5a4aef1",

  measurementId:
    "G-DQFMZD6LZX"

};


const appFirebase =
  initializeApp(firebaseConfig);

const auth =
  getAuth(appFirebase);

const db =
  getFirestore(appFirebase);

const storage =
  getStorage(appFirebase);

const provider =
  new GoogleAuthProvider();


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let myProfile = null;
let selectedUser = null;
let unsubscribeMessages = null;
let currentMessages = [];

const defaultAvatar =
  "https://via.placeholder.com/100";


/* =========================
   ELEMENTS
========================= */

const loginPage =
  document.getElementById("loginPage");

const profilePage =
  document.getElementById("profilePage");

const appPage =
  document.getElementById("app");

const chatList =
  document.getElementById("chatList");

const messagesBox =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const profileDrawer =
  document.getElementById("profileDrawer");


/* =========================
   GOOGLE LOGIN
========================= */

document
  .getElementById("googleLogin")
  .addEventListener("click", async () => {

    try {

      await signInWithPopup(
        auth,
        provider
      );

    } catch(error) {

      console.error(error);

      alert(
        "Google login failed: " +
        error.message
      );

    }

  });


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      currentUser = null;

      loginPage.classList.remove("hidden");
      profilePage.classList.add("hidden");
      appPage.classList.add("hidden");

      return;
    }

    currentUser = user;

    const profileRef =
      doc(
        db,
        "users",
        user.uid
      );

    const profileSnap =
      await getDoc(profileRef);

    if(profileSnap.exists()){

      myProfile = profileSnap.data();

      showApp();

    }else{

      showProfileSetup();

    }

  }
);


/* =========================
   PROFILE SETUP
========================= */

function showProfileSetup(){

  loginPage.classList.add("hidden");
  appPage.classList.add("hidden");
  profilePage.classList.remove("hidden");

  document
    .getElementById("profileName")
    .value =
      currentUser.displayName || "";

  document
    .getElementById("profilePreview")
    .src =
      currentUser.photoURL ||
      defaultAvatar;

}


document
  .getElementById("profilePhoto")
  .addEventListener(
    "change",
    event => {

      const file =
        event.target.files[0];

      if(file){

        const reader =
          new FileReader();

        reader.onload = e => {

          document
            .getElementById("profilePreview")
            .src = e.target.result;

        };

        reader.readAsDataURL(file);

      }

    }
  );


document
  .getElementById("saveProfile")
  .addEventListener(
    "click",
    createProfile
  );


async function createProfile(){

  const name =
    document
      .getElementById("profileName")
      .value
      .trim();

  let username =
    document
      .getElementById("profileUsername")
      .value
      .trim()
      .toLowerCase();

  const photoFile =
    document
      .getElementById("profilePhoto")
      .files[0];

  if(!name){

    alert("Enter your name.");
    return;

  }

  if(!/^[a-z0-9_]{3,20}$/.test(username)){

    alert(
      "Username must be 3-20 characters and contain only letters, numbers or _."
    );

    return;

  }


  const button =
    document.getElementById("saveProfile");

  button.disabled = true;
  button.textContent = "Creating...";


  try{

    /* Check username */

    const usernameQuery =
      query(
        collection(db,"users"),
        where(
          "username",
          "==",
          username
        )
      );

    const usernameSnap =
      await getDoc(
        doc(
          db,
          "usernames",
          username
        )
      );

    if(usernameSnap.exists()){

      alert("Username already taken.");

      button.disabled = false;
      button.textContent =
        "Create Profile";

      return;

    }


    let photoURL =
      currentUser.photoURL ||
      defaultAvatar;


    /* Upload profile photo */

    if(photoFile){

      const photoRef =
        ref(
          storage,
          `profilePhotos/${currentUser.uid}/profile.jpg`
        );

      await uploadBytes(
        photoRef,
        photoFile
      );

      photoURL =
        await getDownloadURL(
          photoRef
        );

    }


    myProfile = {

      uid: currentUser.uid,

      name:name,

      username:username,

      photoURL:photoURL,

      email:
        currentUser.email || "",

      createdAt:
        serverTimestamp(),

      lastSeen:
        serverTimestamp(),

      online:true

    };


    await setDoc(
      doc(
        db,
        "users",
        currentUser.uid
      ),
      myProfile
    );


    /*
      Dedicated username document.
      This makes username lookup easier.
    */

    await setDoc(
      doc(
        db,
        "usernames",
        username
      ),
      {
        uid:currentUser.uid
      }
    );


    showApp();

  }catch(error){

    console.error(error);

    alert(
      "Profile creation failed: " +
      error.message
    );

  }


  button.disabled = false;
  button.textContent =
    "Create Profile";

}

/* =========================
   CHAT ID
========================= */

function makeChatId(uid1,uid2){

  return [
    uid1,
    uid2
  ]
  .sort()
  .join("_");

}


/* =========================
   OPEN CHAT
========================= */

async function openChat(user){

  selectedUser = user;

  document
    .getElementById("headerAvatar")
    .src =
      user.photoURL ||
      defaultAvatar;

  document
    .getElementById("headerName")
    .textContent =
      user.name;

  document
    .getElementById("headerStatus")
    .textContent =
      user.online
      ? "online"
      : "last seen recently";


  messagesBox.innerHTML =
    `<div class="empty">Loading messages...</div>`;


  if(unsubscribeMessages){

    unsubscribeMessages();
    unsubscribeMessages = null;

  }


  const chatId =
    makeChatId(
      currentUser.uid,
      user.uid
    );


  const messagesRef =
    collection(
      db,
      "chats",
      chatId,
      "messages"
    );


  const messagesQuery =
    query(
      messagesRef,
      orderBy(
        "createdAt",
        "asc"
      )
    );


  unsubscribeMessages =
    onSnapshot(
      messagesQuery,
      snapshot => {

        currentMessages = [];

        snapshot.forEach(
          docSnap => {

            currentMessages.push({

              id:docSnap.id,

              ...docSnap.data()

            });

          }
        );

        renderMessages();

      },
      error => {

        console.error(error);

        messagesBox.innerHTML =
          `<div class="empty">
            Could not load messages.<br>
            Check Firestore Rules.
          </div>`;

      }
    );


  document
    .getElementById("chatPanel")
    .classList.add("mobileOpen");

}


/* =========================
   RENDER MESSAGES
========================= */

function renderMessages(){

  if(!currentMessages.length){

    messagesBox.innerHTML =
      `<div class="empty">
        No messages yet.<br>
        Say hello 👋
      </div>`;

    return;

  }


  messagesBox.innerHTML = "";


  currentMessages.forEach(
    message => {

      const row =
        document.createElement("div");

      row.className =
        "messageRow " +
        (
          message.senderId ===
          currentUser.uid
          ? "me"
          : ""
        );


      const bubble =
        document.createElement("div");

      bubble.className =
        "message";


      if(message.replyTo){

        const reply =
          document.createElement("div");

        reply.className =
          "replyPreview";

        reply.textContent =
          "↩ " +
          message.replyTo.text;

        bubble.appendChild(reply);

      }


      if(message.imageUrl){

        const image =
          document.createElement("img");

        image.src =
          message.imageUrl;

        image.loading =
          "lazy";

        bubble.appendChild(image);

      }


      if(message.text){

        const text =
          document.createElement("div");

        text.className =
          "messageText";

        text.textContent =
          message.text;

        bubble.appendChild(text);

      }


      const meta =
        document.createElement("div");

      meta.className =
        "messageMeta";

      meta.textContent =
        formatTime(
          message.createdAt
        );

      bubble.appendChild(meta);


      if(message.reaction){

        const reaction =
          document.createElement("div");

        reaction.className =
          "reaction";

        reaction.textContent =
          message.reaction;

        bubble.appendChild(
          reaction
        );

      }


      /*
        Long press / right click
        message actions
      */

      bubble.addEventListener(
        "contextmenu",
        event => {

          event.preventDefault();

          showMessageMenu(
            event,
            message
          );

        }
      );


      row.appendChild(bubble);

      messagesBox.appendChild(row);

    }
  );


  messagesBox.scrollTop =
    messagesBox.scrollHeight;

}


/* =========================
   TIME
========================= */

function formatTime(timestamp){

  if(!timestamp) return "";

  try{

    const date =
      timestamp.toDate
      ? timestamp.toDate()
      : new Date(timestamp);

    return date.toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }catch{

    return "";

  }

}


/* =========================
   SEND MESSAGE
========================= */

document
  .getElementById("sendBtn")
  .addEventListener(
    "click",
    sendMessage
  );


messageInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


async function sendMessage(){

  if(!selectedUser){

    alert("First select a chat.");

    return;

  }


  const text =
    messageInput
      .value
      .trim();

  if(!text) return;


  messageInput.value = "";


  const chatId =
    makeChatId(
      currentUser.uid,
      selectedUser.uid
    );


  try{

    await addDoc(
      collection(
        db,
        "chats",
        chatId,
        "messages"
      ),
      {

        senderId:
          currentUser.uid,

        receiverId:
          selectedUser.uid,

        text:text,

        imageUrl:"",

        createdAt:
          serverTimestamp(),

        reaction:""

      }
    );


    await setDoc(
      doc(
        db,
        "chats",
        chatId
      ),
      {

        members:[
          currentUser.uid,
          selectedUser.uid
        ],

        lastMessage:text,

        lastMessageAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      },
      {
        merge:true
      }
    );

  }catch(error){

    console.error(error);

    alert(
      "Message failed: " +
      error.message
    );

  }

}


/* =========================

========================= */

document

async function uploadImage(event){

  const file =
    event.target.files[0];

  if(!file) return;

  if(file.size > 10 * 1024 * 1024){

    alert(
      "Image must be under 10 MB."
    );

    return;

  }


  try{

    const chatId =
      makeChatId(
        currentUser.uid,
        selectedUser.uid
      );


    const fileRef =
      ref(
        storage,
        `chatImages/${chatId}/${Date.now()}_${file.name}`
      );


    await uploadBytes(
      fileRef,
      file
    );


    const imageURL =
      await getDownloadURL(
        fileRef
      );


    await addDoc(
      collection(
        db,
        "chats",
        chatId,
        "messages"
      ),
      {

        senderId:
          currentUser.uid,

        receiverId:
          selectedUser.uid,

        text:"",

        imageUrl:imageURL,

        createdAt:
          serverTimestamp(),

        reaction:""

      }
    );


    await setDoc(
      doc(
        db,
        "chats",
        chatId
      ),
      {

        members:[
          currentUser.uid,
          selectedUser.uid
        ],

        lastMessage:"📷 Photo",

        lastMessageAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      },
      {
        merge:true
      }
    );


  }catch(error){

    console.error(error);

    alert(
      "Image upload failed: " +
      error.message
    );

  }


  event.target.value = "";

}


/* =========================
   MESSAGE MENU
========================= */

function showMessageMenu(
  event,
  message
){

  document
    .querySelectorAll(".messageMenu")
    .forEach(
      x => x.remove()
    );


  const menu =
    document.createElement("div");

  menu.className =
    "messageMenu";


  const reply =
    document.createElement("button");

  reply.textContent =
    "↩ Reply";

  reply.onclick = () => {

    messageInput.focus();

    messageInput.placeholder =
      "Replying to: " +
      (
        message.text ||
        "Photo"
      );

    menu.remove();

  };


  const react =
    document.createElement("button");

  react.textContent =
    "❤️ React";

  react.onclick = async () => {

    await reactToMessage(
      message
    );

    menu.remove();

  };


  menu.appendChild(reply);
  menu.appendChild(react);


  if(
    message.senderId ===
    currentUser.uid
  ){

    const del =
      document.createElement("button");

    del.textContent =
      "🗑 Delete";

    del.onclick = async () => {

      await deleteMessage(
        message
      );

      menu.remove();

    };

    menu.appendChild(del);

  }


  document.body.appendChild(menu);


  menu.style.position =
    "fixed";

  menu.style.left =
    Math.min(
      event.clientX,
      window.innerWidth - 140
    ) + "px";

  menu.style.top =
    Math.min(
      event.clientY,
      window.innerHeight - 150
    ) + "px";


  setTimeout(
    () => {

      document.addEventListener(
        "click",
        () => menu.remove(),
        {once:true}
      );

    },
    0
  );

}


/* =========================
   REACTION
========================= */

async function reactToMessage(
  message
){

  if(!selectedUser) return;


  const chatId =
    makeChatId(
      currentUser.uid,
      selectedUser.uid
    );


  await updateDoc(
    doc(
      db,
      "chats",
      chatId,
      "messages",
      message.id
    ),
    {
      reaction:
        message.reaction === "❤️"
        ? ""
        : "❤️"
    }
  );

}


/* =========================
   DELETE MESSAGE
========================= */

async function deleteMessage(
  message
){

  if(!selectedUser) return;


  if(
    !confirm(
      "Delete this message?"
    )
  ){

    return;

  }


  const chatId =
    makeChatId(
      currentUser.uid,
      selectedUser.uid
    );


  await deleteDoc(
    doc(
      db,
      "chats",
      chatId,
      "messages",
      message.id
    )
  );

}

  document

    .value = "";

  document
    .getElementById("userResults")
    .innerHTML = "";

}


document
  .getElementById("usernameSearch")
  .addEventListener(
    "input",
    searchUser
  );


let searchTimer;


function searchUser(){

  clearTimeout(
    searchTimer
  );


  searchTimer =
    setTimeout(
      async () => {

        const username =
          document
            .getElementById("usernameSearch")
            .value
            .trim()
            .toLowerCase();


        const results =
          document
            .getElementById("userResults");


        results.innerHTML = "";


        if(username.length < 3){

          return;

        }


        try{

          const usernameSnap =
            await getDoc(
              doc(
                db,
                "usernames",
                username
              )
            );


          if(
            !usernameSnap.exists()
          ){

            results.innerHTML =
              `<div class="empty">
                User not found.
              </div>`;

            return;

          }


          const uid =
            usernameSnap.data().uid;


          if(
            uid ===
            currentUser.uid
          ){

            results.innerHTML =
              `<div class="empty">
                That's your own account.
              </div>`;

            return;

          }


          const userSnap =
            await getDoc(
              doc(
                db,
                "users",
                uid
              )
            );


          if(
            !userSnap.exists()
          ){

            return;

          }


          const user =
            userSnap.data();


          const result =
            document.createElement("div");

          result.className =
            "searchResult";


          result.innerHTML = `

            <img
              src="${escapeHTML(
                user.photoURL ||
                defaultAvatar
              )}"
            >

            <div>

              <b>${escapeHTML(
                user.name
              )}</b>

              <div style="color:#667781">
                @${escapeHTML(
                  user.username
                )}
              </div>

            </div>

          `;


          result.onclick =
            () => {

              closeNewChat();

              openChat(user);

            };


          results.appendChild(
            result
          );


        }catch(error){

          console.error(error);

          results.innerHTML =
            `<div class="empty">
              Search failed.
            </div>`;

        }

      },
      400
    );

}


/* =========================
   BASIC CHAT LIST
========================= */

async function loadMyChats(){

  /*
    This reads chats where the current
    user is a member.

    Firestore Rules must allow the
    current user to read these.
  */

  try{

    const chatsQuery =
      query(
        collection(
          db,
          "chats"
        ),
        where(
          "members",
          "array-contains",
          currentUser.uid
        )
      );


    onSnapshot(
      chatsQuery,
      async snapshot => {

        chatList.innerHTML = "";


        if(snapshot.empty){

          chatList.innerHTML =
            `<div class="empty">
              No chats yet.<br>
              Tap ✚ to start a chat.
            </div>`;

          return;

        }


        for(
          const chatDoc
          of snapshot.docs
        ){

          const chat =
            chatDoc.data();


          const otherUid =
            chat.members.find(
              uid =>
                uid !==
                currentUser.uid
            );


          if(!otherUid) continue;


          const userSnap =
            await getDoc(
              doc(
                db,
                "users",
                otherUid
              )
            );


          if(!userSnap.exists())
            continue;


          const user =
            userSnap.data();


          const item =
            document.createElement(
              "div"
            );

          item.className =
            "chatItem";


          item.innerHTML = `

            <img
              class="chatAvatar"
              src="${escapeHTML(
                user.photoURL ||
                defaultAvatar
              )}"
            >

            <div class="chatInfo">

              <div class="chatName">
                ${escapeHTML(
                  user.name
                )}
              </div>

              <div class="lastMsg">
                ${escapeHTML(
                  chat.lastMessage ||
                  ""
                )}
              </div>

            </div>

          `;


          item.onclick =
            () => openChat(user);


          chatList.appendChild(
            item
          );

        }

      }
    );

  }catch(error){

    console.error(
      "Chat list error:",
      error
    );

  }

}

/* =========================
   HTML ESCAPE
========================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}
